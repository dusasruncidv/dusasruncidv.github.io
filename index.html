<script>
const SupabaseUrl = "https://xeglssmfqmpyxyyvtukt.supabase.co";
const SupabaseKey = "sb_publishable_GdbyhxPdUbLZXT9WpcobrA_Nvj5x-P_";
const SupabaseClient = window.supabase.createClient(SupabaseUrl, SupabaseKey);
const Times = ["15:30","15:45","16:00","16:15","16:30","16:45","17:00","17:15","17:30","17:45","18:00","18:15","18:30","18:45","19:00","19:15","19:30","19:45","20:00","20:15","20:30","20:45","21:00","21:15","21:30","21:45","22:00","22:15","22:30","22:45"];
let ActiveDaysConfig = [];
let RealtimeChannel = null;
let CurrentMobileDayIndex = 0;
// -- Variables
const HalloweenMonth = 9;
const HalloweenFirstDay = 24;
const HalloweenLastDay = 31;
// -- Functions
function IsHalloweenDate(DateObj) {
return DateObj.getMonth() === HalloweenMonth && DateObj.getDate() >= HalloweenFirstDay && DateObj.getDate() <= HalloweenLastDay;
}
function ApplyHalloweenTheme() {
document.documentElement.classList.toggle("halloween", IsHalloweenDate(new Date()));
}
function IsTimePast(TimeStr) {
const Now = new Date();
const [Hours, Minutes] = TimeStr.split(":").map(Number);
const SlotTime = new Date(Now);
SlotTime.setHours(Hours, Minutes, 0, 0);
return Now > SlotTime;
}
function CheckNoticeVisibility() {
const NoticeEl = document.getElementById("mobileNotice");
if (!NoticeEl) return;
if (window.innerWidth > 768 || !window.CurrentUserId || Number(window.CurrentUserId) === 1) {
NoticeEl.style.display = "none";
return;
}
NoticeEl.style.display = "block";
}
function CalculateActiveDays() {
const Now = new Date();
const CurrentDayNum = Now.getDay();
let baseSun = new Date(Now);
let shift = 0;
if (CurrentDayNum === 5 || CurrentDayNum === 6) {
baseSun.setDate(Now.getDate() + ((7 - CurrentDayNum) % 7));
shift = 0;
} else {
baseSun.setDate(Now.getDate() - CurrentDayNum);
shift = CurrentDayNum;
}
let allDays = [
{ Name: "Svētdiena", DayNum: 0 },
{ Name: "Pirmdiena", DayNum: 1 },
{ Name: "Otrdiena", DayNum: 2 },
{ Name: "Trešdiena", DayNum: 3 },
{ Name: "Ceturtdiena", DayNum: 4 }
];
allDays.forEach(d => {
let dayDate = new Date(baseSun);
let offset = d.DayNum;
if (d.DayNum < shift) {
offset += 7;
}
dayDate.setDate(baseSun.getDate() + offset);
d.DayDate = dayDate;
});
let active = [];
for (let i = 0; i < allDays.length; i++) {
active.push(allDays[(i + shift) % allDays.length]);
}
return active;
}
function FormatDate(DateObj) {
return `${String(DateObj.getDate()).padStart(2,"0")}.${String(DateObj.getMonth() + 1).padStart(2,"0")}`;
}
function BuildTableHeader() {
const Header = document.getElementById("scheduleHeader");
Header.innerHTML = "";
const Tr1 = document.createElement("tr");
const ThDiena = document.createElement("th");
ThDiena.textContent = "Diena";
Tr1.appendChild(ThDiena);
ActiveDaysConfig.forEach((DayObj, Index) => {
const Th = document.createElement("th");
const Now = new Date();
const CurrentDayNum = Now.getDay();
if (DayObj.DayNum === CurrentDayNum) {
Th.classList.add("is-today");
}
if (Index === CurrentMobileDayIndex) Th.classList.add("is-mobile-active");
if (IsHalloweenDate(DayObj.DayDate)) Th.classList.add("halloween");
Th.innerHTML = `<div class="day-header"><span class="day-name">${DayObj.Name}</span><span class="day-date">${FormatDate(DayObj.DayDate)}</span></div>`;
Tr1.appendChild(Th);
});
const Tr2 = document.createElement("tr");
const ThLaiks = document.createElement("th");
ThLaiks.textContent = "Laiks";
Tr2.appendChild(ThLaiks);
ActiveDaysConfig.forEach((DayObj, Index) => {
const Th = document.createElement("th");
const Now = new Date();
const CurrentDayNum = Now.getDay();
if (DayObj.DayNum === CurrentDayNum) {
Th.classList.add("is-today");
}
if (Index === CurrentMobileDayIndex) Th.classList.add("is-mobile-active");
if (IsHalloweenDate(DayObj.DayDate)) Th.classList.add("halloween");
Th.innerHTML = `<div class="sub-header"><span class="sub-name">Vārds</span><span class="sub-room">Istaba</span></div>`;
Tr2.appendChild(Th);
});
Header.appendChild(Tr1);
Header.appendChild(Tr2);
UpdateMobileArrowsState();
}
function UpdateMobileArrowsState() {
const PrevBtn = document.getElementById("prevDayBtn");
const NextBtn = document.getElementById("nextDayBtn");
if (PrevBtn && NextBtn) {
PrevBtn.style.visibility = CurrentMobileDayIndex > 0 ? "visible" : "hidden";
NextBtn.style.visibility = CurrentMobileDayIndex < ActiveDaysConfig.length - 1 ? "visible" : "hidden";
}
}
function ChangeMobileDay(Direction) {
const NewIndex = CurrentMobileDayIndex + Direction;
if (NewIndex >= 0 && NewIndex < ActiveDaysConfig.length) {
CurrentMobileDayIndex = NewIndex;
const Header = document.getElementById("scheduleHeader");
const Tbody = document.getElementById("scheduleBody");
const AllThs = Header.querySelectorAll("th");
AllThs.forEach(Th => Th.classList.remove("is-mobile-active"));
const AllTrs = Tbody.querySelectorAll("tr");
AllTrs.forEach(Tr => {
const Tds = Tr.querySelectorAll("td");
Tds.forEach((Td, ColIdx) => {
Td.classList.remove("is-mobile-active");
if (ColIdx === CurrentMobileDayIndex + 1) {
Td.classList.add("is-mobile-active");
}
});
});
ActiveDaysConfig.forEach((_, ColIdx) => {
if (ColIdx === CurrentMobileDayIndex) {
const ColThs = Header.querySelectorAll(`tr th:nth-child(${ColIdx + 2})`);
ColThs.forEach(Th => Th.classList.add("is-mobile-active"));
}
});
UpdateMobileArrowsState();
}
}
function BuildEmptyTable() {
ActiveDaysConfig = CalculateActiveDays();
if (CurrentMobileDayIndex >= ActiveDaysConfig.length) {
CurrentMobileDayIndex = 0;
}
BuildTableHeader();
const Body = document.getElementById("scheduleBody");
Body.innerHTML = "";
let AllTimesToRender = [...Times];
if (window.CurrentUserId === 1) {
AllTimesToRender.push("Ekstra 1", "Ekstra 2", "Ekstra 3");
}
for (const Time of AllTimesToRender) {
const Tr = document.createElement("tr");
const TimeCell = document.createElement("td");
TimeCell.textContent = Time;
Tr.appendChild(TimeCell);
const IsExtraRow = Time.startsWith("Ekstra");
for (let I = 0; I < ActiveDaysConfig.length; I++) {
const Td = document.createElement("td");
const DayObj = ActiveDaysConfig[I];
const Now = new Date();
const CurrentDayNum = Now.getDay();
if (DayObj.DayNum === CurrentDayNum) {
Td.classList.add("is-today");
}
if (I === CurrentMobileDayIndex) Td.classList.add("is-mobile-active");
if (IsHalloweenDate(DayObj.DayDate)) Td.classList.add("halloween");
if (IsExtraRow) {
const Input = document.createElement("input");
Input.type = "text";
Input.className = "extra-slot-input";
Input.disabled = Number(window.CurrentUserId) !== 1;
Input.addEventListener("change", async () => {
if (Number(window.CurrentUserId) !== 1) return;
try {
await fetch(`${SupabaseUrl}/functions/v1/save-extra`, {
method: "POST",
headers: {
"Content-Type": "application/json",
"apikey": SupabaseKey
},
body: JSON.stringify({
day: DayObj.Name,
time: Time,
value: Input.value,
userId: window.CurrentUserId
})
});
} catch (Failure) {
console.error("Save extra error:", Failure);
}
});
Td.appendChild(Input);
} else {
const Split = document.createElement("div");
Split.className = "cell-split";
Split.addEventListener("click", (E) => HandleSlotClick(E, Split));
const NameEl = document.createElement("div");
NameEl.className = "cell-name";
const RoomEl = document.createElement("div");
RoomEl.className = "cell-room";
Split.appendChild(NameEl);
Split.appendChild(RoomEl);
Td.appendChild(Split);
}
Tr.appendChild(Td);
}
Body.appendChild(Tr);
}
UpdateMobileArrowsState();
CheckNoticeVisibility();
}
function RenderSchedule(Schedule, Extras) {
BuildEmptyTable();
const ScheduleArray = Array.isArray(Schedule) ? Schedule : [];
const ExtrasArray = Array.isArray(Extras) ? Extras : [];
const ScheduleMap = {};
for (const Item of ScheduleArray) {
if (Item && Item.day && Item.time) {
ScheduleMap[`${Item.day}_${Item.time}`] = Item;
}
}
const ExtrasMap = {};
for (const Item of ExtrasArray) {
if (Item && Item.day && Item.time) {
ExtrasMap[`${Item.day}_${Item.time}`] = Item.value;
}
}
const CurrentUserId = Number(window.CurrentUserId);
const CurrentRoom = window.CurrentRoom || localStorage.getItem("scheduleRoom");
const Tbody = document.getElementById("scheduleBody");
const DaysUserHasSlot = new Set();
const RoomDayCounts = {};
ScheduleArray.forEach(Item => {
if (Item && Number(Item.user_id) === CurrentUserId && Item.day) {
DaysUserHasSlot.add(Item.day);
}
if (Item && Item.room && Item.day) {
const Key = `${Item.day}_${Item.room}`;
RoomDayCounts[Key] = (RoomDayCounts[Key] || 0) + 1;
}
});
const RoomsAtLimit = new Set();
ActiveDaysConfig.forEach(DayObj => {
const Day = DayObj.Name;
const Key = `${Day}_${CurrentRoom}`;
if (CurrentUserId !== 1 && (RoomDayCounts[Key] || 0) >= 2) {
RoomsAtLimit.add(Day);
}
});
const Now = new Date();
const CurrentDayNum = Now.getDay();
let AllTimesToRender = [...Times];
if (CurrentUserId === 1) {
AllTimesToRender.push("Ekstra 1", "Ekstra 2", "Ekstra 3");
}
AllTimesToRender.forEach((Time, RowIndex) => {
const Row = Tbody.children[RowIndex];
if (!Row) return;
if (Time.startsWith("Ekstra")) {
ActiveDaysConfig.forEach((DayObj, DayIndex) => {
const Cells = Row.querySelectorAll("input.extra-slot-input");
const Input = Cells[DayIndex];
if (Input) {
const Key = `${DayObj.Name}_${Time}`;
Input.value = ExtrasMap[Key] || "";
}
});
return;
}
ActiveDaysConfig.forEach((DayObj, DayIndex) => {
const Cells = Row.querySelectorAll(".cell-split");
const Cell = Cells[DayIndex];
if (!Cell) return;
const Day = DayObj.Name;
Cell.dataset.day = Day;
Cell.dataset.time = Time;
const IsToday = DayObj.DayNum === CurrentDayNum;
const IsPast = IsToday && IsTimePast(Time);
let IsSelectable = false;
if (CurrentUserId === 1) {
IsSelectable = true;
} else if (CurrentDayNum >= 0 && CurrentDayNum <= 4) {
if (DayObj.DayNum === CurrentDayNum || DayObj.DayNum === (CurrentDayNum + 1) % 7) {
IsSelectable = true;
}
}
const Item = ScheduleMap[`${Day}_${Time}`];
const NameEl = Cell.querySelector(".cell-name");
const RoomEl = Cell.querySelector(".cell-room");
Cell.classList.remove("slot-available", "slot-taken", "slot-mine", "slot-roommate", "user-has-slot", "is-day-today", "is-selectable", "is-admin", "is-past");
if (CurrentUserId === 1) {
Cell.classList.add("is-admin");
}
if (IsToday) {
Cell.classList.add("is-day-today");
}
if (IsPast) {
Cell.classList.add("is-past");
}
if (IsSelectable) {
Cell.classList.add("is-selectable");
}
if (CurrentUserId !== 1 && (DaysUserHasSlot.has(Day) || RoomsAtLimit.has(Day))) {
Cell.classList.add("user-has-slot");
}
if (Item) {
Cell.dataset.scheduleId = Item.id;
Cell.dataset.userId = Item.user_id || "";
if (String(Item.room) === "302") {
NameEl.textContent = "Rezervēts";
} else {
NameEl.textContent = typeof Item.name === "string" ? Item.name : "";
}
RoomEl.textContent = typeof Item.room === "string" ? Item.room : "";
if (Number(Item.user_id) === CurrentUserId) {
Cell.classList.add("slot-mine");
} else if (CurrentRoom && Item.room === CurrentRoom) {
Cell.classList.add("slot-roommate");
} else {
Cell.classList.add("slot-taken");
}
} else {
Cell.dataset.scheduleId = "";
Cell.dataset.userId = "";
NameEl.textContent = "";
RoomEl.textContent = "";
Cell.classList.add("slot-available");
}
});
});
CheckNoticeVisibility();
}
async function HandleSlotClick(E, Cell) {
if (E) E.stopPropagation();
if (!window.CurrentUserId) return;
if (!Cell.classList.contains("is-selectable")) return;
if (Cell.classList.contains("is-past")) return;
const Day = Cell.dataset.day;
const Time = Cell.dataset.time;
const IsMine = Cell.classList.contains("slot-mine");
const IsAvailable = Cell.classList.contains("slot-available");
const IsAdmin = Number(window.CurrentUserId) === 1;
if (!IsAdmin) {
if (!IsAvailable && !IsMine) return;
if (IsAvailable) {
const ExistingUserSlots = document.querySelectorAll(`.cell-split.slot-mine[data-day="${Day}"]`);
if (ExistingUserSlots.length > 0) {
return;
}
const RoomSlots = document.querySelectorAll(`.cell-split.slot-mine[data-day="${Day}"], .cell-split.slot-roommate[data-day="${Day}"]`);
if (RoomSlots.length >= 2) {
return;
}
}
}
try {
const Response = await fetch(`${SupabaseUrl}/functions/v1/toggle-slot`, {
method: "POST",
headers: {
"Content-Type": "application/json",
"apikey": SupabaseKey
},
body: JSON.stringify({
day: Day,
time: Time,
userId: window.CurrentUserId
})
});
const Result = await Response.json();
if (!Response.ok || !Result.success) {
return;
}
} catch (Failure) {
console.error("Slot toggle error:", Failure);
}
}
function SubscribeToScheduleChanges() {
if (RealtimeChannel) return;
RealtimeChannel = SupabaseClient
.channel("schedule-db-changes")
.on(
"postgres_changes",
{ event: "*", schema: "public", table: "schedule" },
() => {
LoadSchedule();
}
)
.on(
"postgres_changes",
{ event: "*", schema: "public", table: "extras" },
() => {
LoadSchedule();
}
)
.subscribe();
}
async function LoadSchedule() {
const { data: ScheduleData, error: ScheduleErr } = await SupabaseClient.from("schedule").select("id,day,time,name,room,user_id").order("time", { ascending: true });
if (ScheduleErr) throw ScheduleErr;
const { data: ExtrasData, error: ExtrasErr } = await SupabaseClient.from("extras").select("id,day,time,value");
if (ExtrasErr) throw ExtrasErr;
RenderSchedule(ScheduleData, ExtrasData);
}
async function Login(AutoRoom = null, AutoPassword = null) {
const RoomInput = document.getElementById("roomInput");
const PasswordInput = document.getElementById("passwordInput");
const LoginButton = document.getElementById("loginButton");
const ErrorMsg = document.getElementById("errorMsg");
const LoadingMsg = document.getElementById("loadingMsg");
const RoomVal = AutoRoom || RoomInput.value;
const PassVal = AutoPassword || PasswordInput.value;
if (!AutoRoom) {
ErrorMsg.style.display = "none";
LoadingMsg.style.display = "block";
if(LoginButton) LoginButton.disabled = true;
}
try {
const Response = await fetch(`${SupabaseUrl}/functions/v1/login`, {
method: "POST",
headers: {
"Content-Type": "application/json",
"apikey": SupabaseKey
},
body: JSON.stringify({
room: RoomVal,
password: PassVal
})
});
const ResponseText = await Response.text();
let Result;
try {
Result = JSON.parse(ResponseText);
} catch {
throw new Error(`Server returned invalid JSON: ${ResponseText}`);
}
if (!Response.ok || !Result.success) throw new Error(Result.error || Result.message || `Login failed (${Response.status})`);
window.CurrentUserId = Number(Result.user.id);
window.CurrentRoom = Result.user.room;
localStorage.setItem("scheduleRoom", Result.user.room);
localStorage.setItem("schedulePassword", PassVal);
document.getElementById("userInfo").textContent = Result.user.name && Result.user.room ? `${Result.user.name} ${Result.user.room}` : Result.user.name;
await LoadSchedule();
SubscribeToScheduleChanges();
UpdateExportVisibility();
UpdateLogoutVisibility();
document.getElementById("loginModal").style.display = "none";
} catch (Failure) {
console.error("Login error:", Failure);
if (AutoRoom) {
localStorage.removeItem("scheduleRoom");
localStorage.removeItem("schedulePassword");
document.getElementById("loginModal").style.display = "flex";
} else {
PasswordInput.value = "";
ErrorMsg.textContent = Failure.message;
ErrorMsg.style.display = "block";
}
} finally {
if (!AutoRoom) {
LoadingMsg.style.display = "none";
if(LoginButton) LoginButton.disabled = false;
}
}
}
function Logout() {
window.CurrentUserId = null;
window.CurrentRoom = null;
localStorage.removeItem("scheduleRoom");
localStorage.removeItem("schedulePassword");
if (RealtimeChannel) {
SupabaseClient.removeChannel(RealtimeChannel);
RealtimeChannel = null;
}
document.getElementById("userInfo").textContent = "";
document.getElementById("roomInput").value = "";
document.getElementById("passwordInput").value = "";
BuildEmptyTable();
document.getElementById("loginModal").style.display = "flex";
UpdateExportVisibility();
UpdateLogoutVisibility();
CheckNoticeVisibility();
}
document.getElementById("roomInput").addEventListener("keydown", KeyEvent => {
if (KeyEvent.key === "Enter") Login();
});
document.getElementById("passwordInput").addEventListener("keydown", KeyEvent => {
if (KeyEvent.key === "Enter") Login();
});
function IsPcAdmin(){return Number(window.CurrentUserId)===1&&window.innerWidth>768;}
function UpdateExportVisibility(){const ExportButton=document.getElementById("exportButton");if(!ExportButton)return;ExportButton.style.display=IsPcAdmin()?"inline-block":"none";}
function UpdateLogoutVisibility(){const LogoutButton=document.getElementById("logoutButton");if(!LogoutButton)return;LogoutButton.style.display=window.CurrentUserId?"inline-flex":"none";}
function ExportSchedule(){
    if(!IsPcAdmin())return;
    const Now=new Date();
    const Year=Now.getFullYear();
    const Month=String(Now.getMonth() + 1).padStart(2,"0");
    const Day=String(Now.getDate()).padStart(2,"0");
    const OriginalTitle=document.title;
    document.title=`Dušu Saraksts ${Month}-${Day}-${Year}`;
    window.print();
}
window.addEventListener("resize",()=>{UpdateExportVisibility();});
window.addEventListener("DOMContentLoaded", () => {
const SavedRoom = localStorage.getItem("scheduleRoom");
const SavedPass = localStorage.getItem("schedulePassword");
if (SavedRoom && SavedPass) {
Login(SavedRoom, SavedPass);
} else {
BuildEmptyTable();
document.getElementById("loginModal").style.display = "flex";
}
setInterval(() => { if (window.CurrentUserId) { LoadSchedule(); CheckNoticeVisibility(); } }, 60000);
});
// -- Events
ApplyHalloweenTheme();
setInterval(ApplyHalloweenTheme, 60000);
</script>
